name: October Holiday Club Finder QA

on:
  pull_request:
    paths:
      - 'kids-family/holiday-club-finder/index.html'
      - 'kids-family/index.html'
      - 'halloween-half-term-guide/guide/index.html'
      - 'tests/holiday-club-finder-browser.mjs'
      - '.github/workflows/holiday-club-finder-qa.yml'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number whose exact preview must be verified'
        required: true
        type: number

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  holiday-finder-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Find Chromium
        shell: bash
        run: |
          set -eu
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null 2>&1; then
            echo "CHROME=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            echo "Chrome/Chromium unavailable"
            exit 1
          fi
      - name: Confirm browser test syntax
        run: node --check tests/holiday-club-finder-browser.mjs
      - name: Serve exact PR files
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/sk8-holiday-finder.log 2>&1 &
          for i in $(seq 1 25); do
            if curl -fsS --max-time 3 http://127.0.0.1:8765/kids-family/holiday-club-finder/ -o /tmp/sk8-holiday-finder-page.html; then
              break
            fi
            sleep 1
          done
          test -s /tmp/sk8-holiday-finder-page.html
      - name: Browser QA desktop and small phone
        env:
          PREVIEW_URL: http://127.0.0.1:8765
        run: node tests/holiday-club-finder-browser.mjs
      - name: Upload finder screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: holiday-club-finder-desktop-mobile
          path: visual-qa/holiday-club-finder
          if-no-files-found: ignore

  hosted-finder-qa:
    needs: holiday-finder-qa
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Find Chromium
        shell: bash
        run: |
          set -eu
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null 2>&1; then
            echo "CHROME=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            echo "Chrome/Chromium unavailable"
            exit 1
          fi
      - name: Resolve Cloudflare exact-revision preview
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [ -n "${PR_NUMBER}" ] || { echo "Manual run needs PR number"; exit 1; }
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100"
          short_sha="${HEAD_SHA:0:7}"
          for n in $(seq 1 30); do
            payload="$(curl -fsSL --max-time 20 -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$api" || true)"
            body="$(printf '%s' "$payload" | jq -r '[.[]? | select(.user.login=="cloudflare-workers-and-pages[bot]")][-1].body // ""' 2>/dev/null || true)"
            line="$(printf '%s\n' "$body" | grep -F '### Preview URL:' | head -n 1 || true)"
            url="$(printf '%s\n' "$line" | grep -Eo 'https://[^ )]+' | head -n 1 || true)"
            reported="$(printf '%s\n' "$line" | grep -Eo 'commit [0-9a-f]{7,40}' | awk '{print $2}' | head -n 1 || true)"
            if [ "$reported" = "$short_sha" ] && [ -n "$url" ]; then
              code="$(curl -sSL --max-time 20 -o /tmp/sk8-finder-exact-preview.html -w '%{http_code}' "${url}/kids-family/holiday-club-finder/" || true)"
              if [ "$code" = 200 ] && grep -Fq "holiday_club_booking_click" /tmp/sk8-finder-exact-preview.html; then
                echo "PREVIEW_URL=$url" >> "$GITHUB_ENV"
                echo "Verified finder route at exact commit ${short_sha}"
                exit 0
              fi
            fi
            echo "Waiting for exact finder preview $short_sha ($n/30)"
            sleep 10
          done
          echo "No matching Cloudflare finder preview; refusing obsolete October branch URL" >&2
          exit 1
      - name: Wait for Cloudflare finder route and assets
        shell: bash
        env:
          PREVIEW_URL: ${{ env.PREVIEW_URL }}
        run: |
          set -eu
          found=false
          for i in $(seq 1 35); do
            if curl -fsSL --max-time 20 "$PREVIEW_URL/kids-family/holiday-club-finder/" -o /tmp/hosted-sk8-finder.html \
                && grep -Fq "holiday_club_booking_click" /tmp/hosted-sk8-finder.html \
                && grep -Fq 'id="finder-join-free"' /tmp/hosted-sk8-finder.html; then
              found=true
              break
            fi
            sleep 7
          done
          if [ "$found" != true ]; then
            echo "Cloudflare finder preview not ready"
            exit 1
          fi
          curl -fsSL --max-time 20 "$PREVIEW_URL/assets/sk8-scoop-logo.webp" -o /tmp/sk8-finder-logo.webp
          test -s /tmp/sk8-finder-logo.webp
          curl -fsSL --max-time 20 "$PREVIEW_URL/assets/site.js" -o /tmp/sk8-finder-site.js
          test -s /tmp/sk8-finder-site.js
      - name: Exercise hosted Cloudflare finder on desktop and phone
        env:
          PREVIEW_URL: ${{ env.PREVIEW_URL }}
        run: node tests/holiday-club-finder-browser.mjs
      - name: Store hosted finder screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-holiday-club-finder-desktop-mobile
          path: visual-qa/holiday-club-finder
          if-no-files-found: ignore
