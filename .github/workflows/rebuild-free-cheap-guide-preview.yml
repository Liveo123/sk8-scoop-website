name: Rebuild Free and Cheap Guide preview

on:
  push:
    branches:
      - preview/homepage-nue-v1
    paths:
      - .github/workflows/rebuild-free-cheap-guide-preview.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
        with:
          ref: preview/homepage-nue-v1
          fetch-depth: 0

      - name: Download rebuilt approved-base guide
        env:
          GUIDE_URL: 'https://sdmntpritalynorth.oaiusercontent.com/files/00000000-9c9c-8246-b546-ebbaa75c1a78/raw?se=2026-09-17T18%3A27%3A00Z&sp=r&sv=2026-02-06&sr=b&scid=376e7886-b1af-5384-906a-5aca14a45a46&skoid=a0b9f82a-c86e-4064-a822-2aa38890bb37&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-17T18%3A14%3A15Z&ske=2026-09-18T18%3A14%3A15Z&sks=b&skv=2026-02-06&sig=vt4XVWlj/LhjpfgS4u68u8T%2B33JGoQ8aGtTPv041TCY%3D'
          GUIDE_SHA256: '5f27c0702101dd6d50d9499a8c8877bd3169753d965010d4f3526054481cd74f'
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --output /tmp/free-cheap-guide.html "$GUIDE_URL"
          echo "$GUIDE_SHA256  /tmp/free-cheap-guide.html" | sha256sum --check --status
          test "$(wc -c < /tmp/free-cheap-guide.html)" -eq 22683675
          cp /tmp/free-cheap-guide.html free-cheap-guide/guide/index.html
          grep -q 'Dated events now live in SK8 Scoop What’s On' free-cheap-guide/guide/index.html
          ! grep -q 'Current window: 13 September to 12 October 2026' free-cheap-guide/guide/index.html

      - name: Commit rebuilt preview artefact
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add free-cheap-guide/guide/index.html
          if git diff --cached --quiet; then
            echo 'No guide change to commit.'
            exit 0
          fi
          git commit -m 'Rebuild Free and Cheap Guide from 12 Sep approved base'
          git push origin HEAD:preview/homepage-nue-v1
