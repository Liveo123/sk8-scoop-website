name: Import exact Free and Cheap Guide

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-free-cheap-guide.yml'

permissions:
  contents: write

jobs:
  import-guide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download exact Drive HTML
        run: |
          python -m pip install --quiet gdown
          gdown 1YDvo0tsdjEbNhYnLnVxfgDzTJONe0PQ8 --output /tmp/guide.html
      - name: Verify exact source
        run: |
          test "$(wc -c < /tmp/guide.html)" = "32156987"
          echo "a37825844af3c9e4c6666e07470979477be336907ff5c58de5e4f0367360fa61  /tmp/guide.html" | sha256sum -c -
      - name: Replace web guide without modifying it
        run: |
          cp /tmp/guide.html free-cheap-guide/guide/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add free-cheap-guide/guide/index.html
          if git diff --cached --quiet; then
            echo "Guide already matches exact Drive source."
            exit 0
          fi
          git commit -m "Publish exact v22.2 Free and Cheap Guide HTML"
          git push origin HEAD:main
