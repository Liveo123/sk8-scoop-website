name: Website Health

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'preview/**'

jobs:
  website-health:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run website health checks
        run: node scripts/website-health.js
