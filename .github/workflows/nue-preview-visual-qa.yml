name: NUE Preview Visual QA

on:
  workflow_dispatch:
  push:
    branches:
      - 'preview/**'
  pull_request:
    paths:
      - 'index.html'
      - 'assets/homepage-search.css'
      - 'assets/whats-on.js'
      - '.github/workflows/nue-preview-visual-qa.yml'

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    env:
      PREVIEW_URL: https://preview-nue-quick-answers-freshness-v1-rebased.previews.sk8scoop.com
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve PR-specific Cloudflare preview URL and revision
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          comments_api="https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100"
          for attempt in $(seq 1 24); do
            payload="$(curl -fsSL --max-time 20 -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" "$comments_api" || true)"
            body="$(printf '%s' "$payload" | jq -r '[.[]? | select(.user.login=="cloudflare-workers-and-pages[bot]")][-1].body // ""' 2>/dev/null || true)"
            line="$(printf '%s\n' "$body" | grep -F '### Preview URL:' | head -n 1 || true)"
            url="$(printf '%s\n' "$line" | grep -Eo 'https://[^ )]+' | head -n 1 || true)"
            reported_sha="$(printf '%s\n' "$line" | grep -Eo 'commit [0-9a-f]{7,40}' | awk '{print $2}' | head -n 1 || true)"
            if [ -n "$url" ] && [ -n "$reported_sha" ] && [[ "$PREVIEW_SHA" == "$reported_sha"* ]]; then
              code="$(curl -sSL --max-time 20 -o /dev/null -w '%{http_code}' "${url}/" || true)"
              if [ "$code" = "200" ]; then
                echo "PREVIEW_URL=$url" >> "$GITHUB_ENV"
                echo "Cloudflare URL verified for commit $reported_sha: $url"
                exit 0
              fi
            fi
            echo "Awaiting exact Cloudflare PR preview for ${PREVIEW_SHA}: attempt $attempt/24"
            sleep 10
          done
          echo "FAILED: no Cloudflare PR preview with matching SHA and HTTP 200"
          exit 1

      - name: Wait for exact Cloudflare preview
        shell: bash
        run: |
          set -eu
          for i in $(seq 1 18); do
            code=$(curl -sS -o /tmp/home.html -w '%{http_code}' "$PREVIEW_URL/" || true)
            if [ "$code" = "200" ] && grep -q 'home-quick-answers' /tmp/home.html; then
              echo "Preview is current and contains Quick Answers."
              exit 0
            fi
            echo "Attempt $i: preview not current yet (HTTP $code)"
            sleep 10
          done
          echo "Preview did not become current in time."
          exit 1

      - name: Locate Chrome
        shell: bash
        run: |
          set -eu
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v google-chrome-stable >/dev/null 2>&1; then
            echo "CHROME=$(command -v google-chrome-stable)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null 2>&1; then
            echo "CHROME=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            echo "No Chrome/Chromium available on runner"
            exit 1
          fi

      - name: Capture desktop and mobile screenshots
        shell: bash
        run: |
          set -eu
          mkdir -p visual-qa
          "$CHROME" --headless --disable-gpu --no-sandbox --hide-scrollbars             --window-size=1440,1800 --virtual-time-budget=5000             --screenshot=visual-qa/home-desktop.png "$PREVIEW_URL/"
          "$CHROME" --headless --disable-gpu --no-sandbox --hide-scrollbars             --window-size=390,5000 --force-device-scale-factor=1 --virtual-time-budget=5000             --screenshot=visual-qa/home-mobile.png "$PREVIEW_URL/"
          "$CHROME" --headless --disable-gpu --no-sandbox --hide-scrollbars             --window-size=390,1600 --force-device-scale-factor=1 --virtual-time-budget=5000             --screenshot=visual-qa/whats-on-mobile-weekend.png "$PREVIEW_URL/whats-on/?filter=weekend"

      - name: Dump rendered DOM for route checks
        shell: bash
        run: |
          set -eu
          "$CHROME" --headless --disable-gpu --no-sandbox --virtual-time-budget=5000             --dump-dom "$PREVIEW_URL/" > visual-qa/home-rendered.html
          "$CHROME" --headless --disable-gpu --no-sandbox --virtual-time-budget=5000             --dump-dom "$PREVIEW_URL/whats-on/?filter=weekend#current-listings" > visual-qa/whats-on-weekend-rendered.html
          grep -q 'home-quick-answers' visual-qa/home-rendered.html
          grep -q 'aria-pressed="true">Weekend' visual-qa/whats-on-weekend-rendered.html

      - name: Upload visual QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nue-preview-visual-qa
          path: visual-qa/
          retention-days: 7
