name: Publish 52 Adventures guide
# retrigger with verified patched SHA 2026-09-19
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-52-adventures-2026-09-19.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download exact v1.8 production checkpoint
        env:
          SOURCE_URL: 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-0e10-8210-9fbd-4b2a20be7b7b/raw?se=2026-09-19T11%3A54%3A49Z&sp=r&sv=2026-02-06&sr=b&scid=e3cdc2ed-fdd2-5db3-b5f9-812073082750&skoid=a0b9f82a-c86e-4064-a822-2aa38890bb37&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-19T06%3A28%3A20Z&ske=2026-09-20T06%3A28%3A20Z&sks=b&skv=2026-02-06&sig=jobjiQoi4auLhqPe%2BI8id/e4XtJWGnkSLmQ29SCL4Nk%3D'
        run: |
          mkdir -p 52-adventures/guide
          curl --fail --location --retry 3 "$SOURCE_URL" -o /tmp/guide.html
          echo "e29fd2507dfe3a8ec5e690f9a738d6f0fd33bb230a7b1e49cba6b334d9b33405  /tmp/guide.html" | sha256sum -c -
      - name: Apply approved browser fixes and logo spacing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('/tmp/guide.html')
          s=p.read_text(encoding='utf-8')
          reps=[
            (
              '.sitebar-inner{min-height:76px;gap:24px}.brand-mini{width:210px;height:52px;object-fit:contain;object-position:left center}',
              '.sitebar-inner{min-height:76px;gap:24px}.brand-mini{width:210px;height:60px;object-fit:contain;object-position:left center;box-sizing:border-box;padding:3px 4px 9px;background:#fff}'
            ),
            (
              '.sitebar-inner{min-height:62px}.brand-mini{width:150px;height:42px}',
              '.sitebar-inner{min-height:66px}.brand-mini{width:150px;height:48px;padding:2px 3px 7px}'
            ),
            (
              "if(!dialog.open)dialog.showModal();if(push)history.pushState({adventure:n},'','#adventure-'+n)",
              "if(!dialog.open){dialog.showModal();document.getElementById('dialog-close').focus()}if(push)history.pushState({adventure:n},'','#adventure-'+n)"
            ),
            (
              "document.getElementById('dialog-close').onclick=closeToReturnView;dialog.addEventListener('click',e=>{if(e.target===dialog)closeToReturnView()});document.getElementById('menu-toggle').onclick=()=>{const open=document.querySelector('.top-nav').classList.toggle('open');document.getElementById('menu-toggle').setAttribute('aria-expanded',String(open))};",
              "document.getElementById('dialog-close').onclick=closeToReturnView;dialog.addEventListener('click',e=>{if(e.target===dialog)closeToReturnView()});dialog.addEventListener('cancel',e=>{e.preventDefault();closeToReturnView()});dialog.addEventListener('keydown',e=>{if(e.key!=='Tab'||!dialog.open)return;const focusable=[...dialog.querySelectorAll('button,[href],input,select,textarea,[tabindex]:not([tabindex=\"-1\"])')].filter(x=>!x.disabled&&x.offsetParent!==null);if(!focusable.length){e.preventDefault();return}const first=focusable[0],last=focusable[focusable.length-1],active=document.activeElement;if(e.shiftKey&&(active===first||!dialog.contains(active))){e.preventDefault();last.focus()}else if(!e.shiftKey&&active===last){e.preventDefault();first.focus()}});document.getElementById('menu-toggle').onclick=()=>{const open=document.querySelector('.top-nav').classList.toggle('open');document.getElementById('menu-toggle').setAttribute('aria-expanded',String(open))};"
            )
          ]
          for old,new in reps:
            if old not in s:
              raise SystemExit('Expected patch target not found: '+old[:80])
            s=s.replace(old,new,1)
          out=Path('52-adventures/guide/index.html')
          out.write_text(s,encoding='utf-8')
          digest=hashlib.sha256(out.read_bytes()).hexdigest()
          expected='f532682bb9929750e622aa1daaa4c56d9fdeb4c8d179c68a93e82f60ec353c86'
          if digest!=expected:
            raise SystemExit(f'Unexpected final SHA256: {digest}')
          print('52 Adventures verified:', out.stat().st_size, digest)
          PY
      - name: Commit published guide
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 52-adventures/guide/index.html
          if git diff --cached --quiet; then
            echo "Guide already matches the approved published build."
            exit 0
          fi
          git commit -m "Publish 52 Adventures guide"
          git push origin HEAD:main
