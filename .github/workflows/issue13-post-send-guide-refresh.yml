name: Stage Issue 13 Free and Cheap Guide refresh

on:
  push:
    branches:
      - issue13-post-send-nue
    paths:
      - 'scripts/refresh_free_cheap_issue13.py'
      - '.github/workflows/issue13-post-send-guide-refresh.yml'

permissions:
  contents: write

jobs:
  refresh-guide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue13-post-send-nue
          fetch-depth: 0
      - name: Refresh guide from Issue 13 harvest
        run: python scripts/refresh_free_cheap_issue13.py
      - name: Verify staged guide
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('free-cheap-guide/guide/index.html').read_text(encoding='utf-8')
          checks = {
              '18 Sep title': 'Fully Updated 18 September 2026' in text,
              'Heald Green walk': '/local-history/heald-green-north-history-walk/' in text,
              'One Stop Away': '/outdoors/one-stop-away/' in text,
              'CoderDojo': 'CHEADLE CODERDOJO 60' in text,
              'Lifesavers full': 'FREE · CURRENTLY FULL' in text,
              'expired 13 Sep removed': 'PAPER PULP CLAY WORKSHOP' not in text,
          }
          bad = [k for k,v in checks.items() if not v]
          print(checks)
          if bad:
              raise SystemExit('Failed checks: ' + ', '.join(bad))
          PY
      - name: Commit staged production guide
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add free-cheap-guide/guide/index.html
          if git diff --cached --quiet; then
            echo "Guide already refreshed."
            exit 0
          fi
          git commit -m "Stage Issue 13 Free & Cheap guide refresh"
          git push origin HEAD:issue13-post-send-nue
