name: Business submissions preview QA

on:
  pull_request:
    paths:
      - 'business-submissions/index.html'
      - 'assets/business-submissions.css'
      - 'assets/business-submissions.js'
      - 'worker-business-v2.js'
      - 'schema.sql'
      - 'tests/business-submissions-*.mjs'
      - '.github/workflows/business-submissions-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  business-submission-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check worker-business-v2.js
          node --check assets/business-submissions.js
          node --check tests/business-submissions-qa.mjs
          node --check tests/business-submissions-browser.mjs
      - name: Mock D1 and Resend to test submissions safely
        run: node tests/business-submissions-qa.mjs
      - name: Find Chrome
        shell: bash
        run: |
          set -eu
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v google-chrome-stable >/dev/null 2>&1; then
            echo "CHROME=$(command -v google-chrome-stable)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null 2>&1; then
            echo "CHROME=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            echo "No Chrome available"
            exit 1
          fi
      - name: Serve source files for browser QA
        run: |
          python3 -m http.server 8771 --bind 127.0.0.1 >/tmp/sk8-business-qa.log 2>&1 &
          for n in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:8771/business-submissions/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8771/business-submissions/ | grep -Fq 'business-fast-form'
      - name: Verify desktop/mobile browser and intercept every test POST
        env:
          CHROME: ${{ env.CHROME }}
        run: node tests/business-submissions-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sk8-business-submissions-preview-mobile
          path: visual-qa/business-submissions/
          retention-days: 7
          if-no-files-found: ignore
