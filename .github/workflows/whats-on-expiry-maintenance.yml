name: What's On expiry maintenance

on:
  schedule:
    - cron: '20 5 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/prune-expired-events.mjs'
      - 'tests/prune-expired-events-fixtures.mjs'
      - '.github/workflows/whats-on-expiry-maintenance.yml'

permissions:
  contents: write

concurrency:
  group: whats-on-expiry-maintenance-main
  cancel-in-progress: false

jobs:
  expiry:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check expiry safety fixtures
        run: node tests/prune-expired-events-fixtures.mjs
      - name: Retire expired records and reconcile historical handoffs
        run: node scripts/prune-expired-events.mjs --apply
      - name: Validate data, history, and editorial gates
        run: |
          node scripts/check-events-data.mjs
          node tests/check-events-data-fixtures.mjs
          node scripts/check-event-review-queue.mjs
          node scripts/promote-ready-events.mjs
          node scripts/check-post-launch-v2.mjs
          git diff --check
      - name: Confirm change scope
        shell: bash
        run: |
          extras="$(git diff --name-only -- . ':!data/events.json' ':!data/website-harvest.json')"
          if [ -n "$extras" ]; then
            echo "Unexpected modified files: $extras"
            exit 1
          fi
      - name: Commit only verified expiry changes
        shell: bash
        run: |
          if git diff --quiet -- data/events.json data/website-harvest.json; then
            echo 'No expired events; nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/events.json data/website-harvest.json
          git commit -m 'chore(whats-on): retire expired events and preserve audit'
          git push origin HEAD:main
          echo 'Changed source; production deployment must still be verified.'


      - name: Verify exact production JSON parity
        shell: bash
        run: |
          set -euo pipefail
          # GITHUB_TOKEN pushes do not trigger ordinary GitHub Actions push workflows.
          # Cloudflare has independent Git integration; verify actual public JSON
          # before declaring a cleanup published.
          expected_commit="$(git rev-parse HEAD)"
          for attempt in $(seq 1 30); do
            url="https://www.sk8scoop.com/data/events.json?whatson_parity=$expected_commit-$attempt"
            if curl --fail --silent --show-error --location --max-time 20 \
              -H 'Cache-Control: no-cache' "$url" -o /tmp/sk8-expiry-live.json; then
              if node -e 'const fs=require("node:fs");const expected=JSON.parse(fs.readFileSync("data/events.json","utf8"));const actual=JSON.parse(fs.readFileSync("/tmp/sk8-expiry-live.json","utf8"));if(JSON.stringify(actual)!==JSON.stringify(expected)){console.error("Live events.json differs from checked-out GitHub source");process.exit(1)}'; then
                echo "PASS: live What's On event JSON exactly matches $expected_commit"
                exit 0
              fi
            fi
            echo "Cloudflare production parity not ready (attempt $attempt/30)"
            sleep 12
          done
          echo 'ERROR: daily expiry task cannot verify production parity; treat job as FAILED.'
          exit 1
