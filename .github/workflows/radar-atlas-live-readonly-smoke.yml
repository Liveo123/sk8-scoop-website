name: Radar Atlas live URLs (read-only)
on:
  pull_request:
    paths:
      - 'radar/**'
      - 'radar-referral-service.js'
      - 'wrangler.toml'
      - '.github/workflows/radar-atlas-live-readonly-smoke.yml'
  workflow_dispatch:
jobs:
  verify-live-atlas:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download published guide without subscribing anyone
        run: |
          set -eu
          curl -fsSL --retry 3 --retry-delay 2 --max-time 45 \
            https://www.sk8scoop.com/radar/adventure-atlas/ \
            -o /tmp/radar-atlas.html
          curl -fsSL --retry 3 --retry-delay 2 --max-time 45 \
            https://www.sk8scoop.com/radar/adventure-atlas/download.pdf \
            -o /tmp/radar-atlas.pdf
      - name: Inspect deployed referral flags and page (GET only, zero subscriber writes)
        run: |
          set -eu
          curl -fsSL --retry 3 --retry-delay 2 --max-time 45 \
            https://www.sk8scoop.com/api/radar-referral-status \
            -o /tmp/radar-referral-status.json
          curl -fsSL --retry 3 --retry-delay 2 --max-time 45 \
            https://www.sk8scoop.com/radar/referral/ \
            -o /tmp/radar-referral-page.html
          curl -fsSL --retry 3 --retry-delay 2 --max-time 45 \
            https://www.sk8scoop.com/radar/ \
            -o /tmp/radar-landing.html
      - name: Assert production referral stays disabled during controlled testing
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path('/tmp/radar-referral-status.json').read_text())
          assert state.get('enabled') is False, 'STOP: production referral signup is unexpectedly enabled'
          page=Path('/tmp/radar-referral-page.html').read_text()
          landing=Path('/tmp/radar-landing.html').read_text()
          assert 'Send my code' in page, 'Referral page missing'
          assert 'referral-code-form' in page, 'Referral request form missing'
          assert 'radar-signup' in landing, 'Newsletter signup form missing'
          assert 'radar-referral-field' in landing, 'Referral field not integrated into latest Radar design'
          assert 'hidden' in landing[landing.index('id="radar-referral-field"')-80:landing.index('id="radar-referral-field"')+40], 'Referral field must default hidden'
          print('PASS: deployed production referral is OFF; signup and referral pages exist; no POST requests or emails sent')
          PY
      - name: Validate exact publication content
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html=Path('/tmp/radar-atlas.html').read_text(encoding='utf-8')
          pdf=Path('/tmp/radar-atlas.pdf').read_bytes()
          expected=['Creepy Carnival','Mad Hatter','velodrome','Mersey']
          for term in expected:
              assert term.lower() in html.lower(), f'Missing adventure: {term}'
          assert '<title>The Unordinary Four' in html, 'Wrong HTML route or title'
          assert 'noindex' in html.lower(), 'Guide should not be indexed'
          assert pdf.startswith(b'%PDF-'), 'Download URL does not return a PDF'
          assert len(pdf)>500_000, 'Truncated PDF'
          print(f'PASS: live HTML {len(html):,} bytes; PDF {len(pdf):,} bytes; four adventures found')
          PY
