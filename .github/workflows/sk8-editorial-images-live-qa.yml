name: SK8 editorial image production QA
on:
  pull_request:
    paths:
      - '.github/workflows/sk8-editorial-images-live-qa.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/sk8-editorial-images-live-qa.yml'
      - 'assets/images/editorial-20261010/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-20-live-images:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Check real production image bytes and page references
        shell: bash
        run: |
          python3 - <<'PY'
          import time
          import urllib.request
          from pathlib import Path
          
          BASE = 'https://www.sk8scoop.com'
          EXPECTED = {"/":["SK8-01-planning"],"/planning/":["SK8-01-planning"],"/around-sk8/":["SK8-01-planning","SK8-04-around-discovery","SK8-12-local-history"],"/about.html":["SK8-02-about"],"/archive.html":["SK8-03-archive"],"/cheadle/":["SK8-05-cheadle-overview","SK8-14-cheadle-former-station","SK8-15-cheadle-eco-park"],"/cheadle-hulme/":["SK8-06-cheadle-hulme-overview","SK8-16-oak-meadow","SK8-17-cheadle-hulme-village"],"/gatley/":["SK8-07-gatley-overview","SK8-18-gatley-shouter"],"/heald-green/":["SK8-08-heald-green-overview","SK8-19-heald-green-mercury","SK8-20-heald-green-wartime"],"/food-drink/":["SK8-09-food-drink"],"/kids-family/":["SK8-10-kids-family"],"/outdoors/":["SK8-11-outdoors"],"/local-history/":["SK8-12-local-history"],"/updates/":["SK8-13-useful-updates"]}
          image_names = sorted({name for filenames in EXPECTED.values() for name in filenames})
          assert len(image_names) == 20, f'Expected 20 images; found {len(image_names)}'
          assert sum(len(x) for x in EXPECTED.values()) == 23
          
          def read_url(url):
              last_error = None
              for attempt in range(5):
                  try:
                      request = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 SK8ScoopMediaQA/1.0'})
                      with urllib.request.urlopen(request, timeout=30) as response:
                          status = response.status
                          mime = response.headers.get('Content-Type', '')
                          data = response.read()
                      if status != 200:
                          raise RuntimeError(f'HTTP {status}')
                      return mime, data
                  except Exception as exc:
                      last_error = exc
                      print(f'Retry {attempt + 1}/5 {url}: {exc}', flush=True)
                      if attempt < 4:
                          time.sleep(5)
              raise RuntimeError(f'Unable to load {url}: {last_error}')
          
          for name in image_names:
              path = f'/assets/images/editorial-20261010/{name}.webp'
              mime, data = read_url(BASE + path)
              if len(data) < 10000:
                  raise AssertionError(f'{path}: only {len(data)} bytes')
              if not (data.startswith(b'RIFF') and data[8:12] == b'WEBP'):
                  raise AssertionError(f'{path}: invalid WebP content')
              if 'image/webp' not in mime.lower():
                  raise AssertionError(f'{path}: wrong HTTP Content-Type: {mime}')
              print(f'OK WEBP {path}, bytes={len(data)}', flush=True)
          
          for route, filenames in EXPECTED.items():
              mime, data = read_url(BASE + route)
              text = data.decode('utf-8', errors='replace')
              if 'text/html' not in mime.lower():
                  raise AssertionError(f'{route}: expected HTML, got {mime}')
              for name in filenames:
                  src = f'/assets/images/editorial-20261010/{name}.webp'
                  if src not in text:
                      raise AssertionError(f'{route}: missing live image reference {src}')
                  print(f'OK HTML {route}: {name}.webp', flush=True)
          
          print('PASS: 20 WebP files, 14 pages, 23 live placements, valid MIME and binary data', flush=True)
          PY
