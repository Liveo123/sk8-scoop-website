name: Import exact Free and Cheap Guide v4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-free-cheap-guide-v4.yml'

permissions:
  contents: write

jobs:
  import-guide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download exact Drive HTML
        run: |
          python - <<'PY'
          import html, re, requests
          from urllib.parse import urljoin
          file_id='1YDvo0tsdjEbNhYnLnVxfgDzTJONe0PQ8'
          s=requests.Session()
          r=s.get('https://drive.google.com/uc',params={'export':'download','id':file_id},timeout=60)
          ct=(r.headers.get('content-type') or '').lower()
          if 'text/html' in ct:
              text=r.text
              m=re.search(r'<form[^>]+id="download-form"[^>]+action="([^"]+)"', text)
              if not m:
                  m=re.search(r'<form[^>]+action="([^"]+)"[^>]*>', text)
              if not m:
                  raise SystemExit('Could not find Google Drive download confirmation form')
              action=html.unescape(m.group(1))
              params={k:html.unescape(v) for k,v in re.findall(r'<input[^>]+name="([^"]+)"[^>]+value="([^"]*)"', text)}
              r=s.get(urljoin(r.url, action), params=params, timeout=120, stream=True)
          r.raise_for_status()
          with open('/tmp/guide.html','wb') as f:
              for chunk in r.iter_content(1024*1024):
                  if chunk: f.write(chunk)
          PY
      - name: Verify exact source
        run: |
          wc -c /tmp/guide.html
          sha256sum /tmp/guide.html
          test "$(wc -c < /tmp/guide.html)" = "32156987"
          echo "a37825844af3c9e4c6666e07470979477be336907ff5c58de5e4f0367360fa61  /tmp/guide.html" | sha256sum -c -
      - name: Replace web guide without modifying it
        run: |
          cp /tmp/guide.html free-cheap-guide/guide/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add free-cheap-guide/guide/index.html
          if git diff --cached --quiet; then
            echo "Guide already matches exact Drive source."
            exit 0
          fi
          git commit -m "Publish exact v22.2 Free and Cheap Guide HTML"
          git push origin HEAD:main
