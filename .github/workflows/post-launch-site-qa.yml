name: Post-launch site QA

permissions:
  contents: read
  checks: read
  issues: read
  pull-requests: read

on:
  pull_request:
  push:
    branches:
      - improve/post-launch-nue-v2
      - main

# Direct-to-main maintenance often lands as several small commits within a minute.
# Keep only the newest QA run for a branch/PR so superseded intermediate states
# do not generate a burst of failure notifications.
concurrency:
  group: post-launch-site-qa-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Debounce rapid main pushes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "Waiting briefly so a batch of maintenance commits can settle..."
          sleep 120
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check guide public samples and subscriber gates
        run: node scripts/check-guide-public-samples.mjs
      - name: Check current issue freshness
        run: node scripts/check-current-content.mjs
      - name: Check post-launch NUE contracts
        run: node scripts/check-post-launch-v2.mjs
      - name: Enforce no-SVG visual rule
        run: node scripts/check-no-svg.mjs
      - name: Check Free & Cheap guide presentation and expiry
        run: node scripts/check-free-cheap-guide-ui.mjs
      - name: Check advertiser growth-engine JavaScript
        run: |
          if [ -f worker-business-v2.js ]; then node --check worker-business-v2.js; fi
          if [ -f worker-protected.js ]; then node --check worker-protected.js; fi
          if [ -f assets/site.js ]; then node --check assets/site.js; fi
          if [ -f assets/my-sk8.js ]; then node --check assets/my-sk8.js; fi
          if [ -f tests/my-sk8-browser.mjs ]; then node --check tests/my-sk8-browser.mjs; fi
          if [ -f scripts/check-header-layout.mjs ]; then node --check scripts/check-header-layout.mjs; fi
          if [ -f assets/secret-trail-feedback-admin.js ]; then node --check assets/secret-trail-feedback-admin.js; fi
          if [ -f assets/campaign-finder.js ]; then node --check assets/campaign-finder.js; fi
          if [ -f assets/advertise.js ]; then node --check assets/advertise.js; fi
          if [ -f assets/nue-links.js ]; then node --check assets/nue-links.js; fi
      - name: Check advertiser growth-engine contracts
        run: node scripts/check-advertiser-growth-engine.mjs

  preview-smoke:
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'push' && github.ref == 'refs/heads/improve/post-launch-nue-v2')
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the Cloudflare version preview and verify release markers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || '' }}
        run: |
          checks_api="https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${PREVIEW_SHA}/check-runs"
          commit_api="https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${PREVIEW_SHA}"
          auth=(-H "authorization: Bearer ${GH_TOKEN}" -H "accept: application/vnd.github+json")
          base=""
          short_sha="$(printf '%s' "$PREVIEW_SHA" | cut -c1-8)"
          workflow_only=false
          commit_payload="$(curl -fsSL --max-time 20 "${auth[@]}" "$commit_api" || true)"
          non_workflow_files="$(printf '%s' "$commit_payload" | jq '[.files[]? | select((.filename | startswith(".github/workflows/")) | not)] | length' 2>/dev/null || echo 1)"
          if [ "$non_workflow_files" = "0" ]; then workflow_only=true; fi
          for attempt in $(seq 1 30); do
            payload="$(curl -fsSL --max-time 20 "${auth[@]}" "$checks_api" || true)"
            summary="$(printf '%s' "$payload" | jq -r '.check_runs[]? | select(.name=="Workers Builds: sk8-scoop" and .conclusion=="success") | .output.summary // empty' | head -n 1)"
            base="$(printf '%s' "$summary" | sed -n 's#.*Preview URL: \(https://[^[:space:]]*\).*#\1#p' | head -n 1)"
            if [ -z "$base" ] && [ -n "$PR_NUMBER" ]; then
              comments_api="https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments"
              comments="$(curl -fsSL --max-time 20 "${auth[@]}" "$comments_api" || true)"
              cf_body="$(printf '%s' "$comments" | jq -r '[.[]? | select(.user.login=="cloudflare-workers-and-pages[bot]")][-1].body // empty' 2>/dev/null || true)"
              cf_line="$(printf '%s\n' "$cf_body" | grep -F '### Preview URL:' | head -n 1 || true)"
              cf_url="$(printf '%s\n' "$cf_line" | grep -Eo 'https://[^ )]+' | head -n 1 || true)"
              cf_sha="$(printf '%s\n' "$cf_line" | grep -Eo 'commit [0-9a-f]{7,40}' | awk '{print $2}' | head -n 1 || true)"
              if [ -z "$cf_url" ]; then
                cf_url="$(printf '%s' "$cf_body" | grep -Eo "https://[^' <]*(workers\.dev|previews\.sk8scoop\.com)" | head -n 1 || true)"
              fi
              if [ -z "$cf_sha" ]; then
                cf_sha="$(printf '%s' "$cf_body" | grep -Eo '<td>[0-9a-f]{7,40}</td>' | sed -n '1s#<td>\(.*\)</td>#\1#p' || true)"
              fi
              echo "Cloudflare PR preview candidate: url=$cf_url sha=$cf_sha expected=$short_sha"
              sha_matches=false
              if [ -n "$cf_sha" ] && [[ "$PREVIEW_SHA" == "$cf_sha"* ]]; then sha_matches=true; fi
              if [ -n "$cf_url" ] && { [ "$sha_matches" = true ] || [ "$workflow_only" = true ]; }; then
                base="$cf_url"
              fi
            fi
            if [ -n "$base" ]; then
              echo "CLOUDFLARE_PREVIEW_BASE=$base" >> "$GITHUB_ENV"
              echo "Cloudflare preview: $base"
              break
            fi
            echo "Waiting for Cloudflare version preview URL (attempt $attempt/30)"
            sleep 10
          done
          if [ -z "$base" ]; then
            echo "FAILED: no suitable Cloudflare version preview URL found for $PREVIEW_SHA"
            exit 1
          fi
          check_page() {
            path="$1"
            marker="$2"
            url="${base}${path}"
            body_file="/tmp/sk8-preview-page"
            for attempt in $(seq 1 12); do
              if curl -fsSL --max-time 20 "$url" -o "$body_file" && grep -Fq "$marker" "$body_file"; then
                echo "OK preview: $url"
                return 0
              fi
              echo "Waiting for preview: $url (attempt $attempt/12)"
              sleep 15
            done
            echo "FAILED preview marker: $url"
            return 1
          }
          check_page '/' 'homepage-utility-promise-v1'
          check_page '/whats-on/' 'data-event-area="Cheadle"'
          check_page '/guides/' 'data-page="guides"'
          check_page '/guides/' 'Halloween &amp; Half-Term Family Guide 2026'
          check_page '/start/' 'data-page="start"'
          check_page '/join/' 'data-page="join"'
          check_page '/submit/' 'action="/api/reader-submission"'
          check_page '/contact/' 'data-form-kind="contact-message"'
          check_page '/submit-event/' 'action="/api/submit-event"'
          check_page '/business-submissions/' 'action="/api/business-submission"'
          check_page '/advertise.html' 'value="starter_newsletter"'
          check_page '/advertise/finder/' 'id="campaign-finder"'
          check_page '/advertise/christmas-eating-out/' 'Promote Christmas bookings'
          check_page '/advertise/pay/' 'Payment follows campaign approval'
          check_page '/around-sk8/' 'data-page="around-sk8"'
          check_page '/food-drink/' 'Food & Drink around SK8'
          check_page '/kids-family/' 'Kids & Family around SK8'
          check_page '/outdoors/' 'Outdoors around SK8'
          check_page '/local-history/' 'Local History around SK8'
          check_page '/planning/' 'Planning & Development around SK8'
          check_page '/free-cheap-guide/' 'Heald Green North History Walk'
          check_page '/52-adventures/' 'data-page="52-adventures"'
          check_page '/halloween-half-term-guide/' 'Free Halloween &amp; Half-Term Family Guide 2026'
          check_page '/halloween-half-term-guide/feedback/' 'Halloween Guide Tester Feedback'
          check_page '/halloween/boo/' 'BOO! You found Easter egg #5'
          check_page '/poll/issue-16/' 'What would you most like more of in next year’s Halloween coverage?'
          check_page '/local-history/heyhead-village-disappeared/' 'Heyhead: the village that disappeared beside the airport'
          feedback_code="$(curl -sS --max-time 20 -o /tmp/halloween-feedback-api.json -w '%{http_code}' -X POST "${base}/api/reader-submission" -H 'content-type: application/json' --data '{}')"
          if [ "$feedback_code" != "503" ]; then
            echo "FAILED Preview feedback isolation: expected 503 without the reader_submissions preview table, got $feedback_code"
            cat /tmp/halloween-feedback-api.json || true
            exit 1
          fi
          echo "OK Preview feedback isolation: reader_submissions is not inherited"
          live_feedback_code="$(curl -sS --max-time 20 -o /tmp/halloween-feedback-api-live-ready.json -w '%{http_code}' -X POST 'https://www.sk8scoop.com/api/reader-submission' -H 'content-type: application/json' --data '{}')"
          if [ "$live_feedback_code" != "400" ]; then
            echo "FAILED production Halloween feedback API readiness: expected 400 validation response, got $live_feedback_code"
            cat /tmp/halloween-feedback-api-live-ready.json || true
            exit 1
          fi
          echo "OK production Halloween feedback API readiness: 400 validation response"
          check_page '/secret-trails/cheadle/' '/secret-trails/cheadle/SK8-Secret-Trails-The-Cheadle-Case.pdf'
          check_pdf_download() {
            url="${base}/secret-trails/cheadle/SK8-Secret-Trails-The-Cheadle-Case.pdf"
            headers="/tmp/secret-trail-preview-headers"
            body="/tmp/secret-trail-preview.pdf"
            code="$(curl -sS --max-time 30 -D "$headers" -o "$body" -w '%{http_code}' "$url" || true)"
            bytes="$(wc -c < "$body" 2>/dev/null || echo 0)"
            kind="$(file -b "$body" 2>/dev/null || true)"
            content_type="$(tr -d '\r' < "$headers" | awk 'BEGIN{IGNORECASE=1} /^content-type:/ {print; exit}')"
            if [ "$code" != "200" ] || [ "$bytes" -lt 1000000 ] || ! printf '%s' "$kind" | grep -Fqi 'PDF document' || ! printf '%s' "$content_type" | grep -Fqi 'application/pdf'; then
              echo "FAILED Secret Trail PDF preview access (HTTP $code; bytes=$bytes; type=$kind; content_type=$content_type)"
              return 1
            fi
            echo "OK Secret Trail PDF preview access (bytes=$bytes; type=$kind)"
          }
          check_pdf_download
          check_page '/secret-trails/cheadle/feedback/' 'action="/api/secret-trail-feedback"'
          check_page '/assets/site.js' "'secret-trail-feedback':'secret_trail_feedback_visit'"
          check_page '/admin/secret-trail-feedback/' 'data-secret-trail-feedback-admin'
          check_direct_guide() {
            path="$1"
            marker="$2"
            url="${base}${path}"
            for attempt in $(seq 1 12); do
              headers="/tmp/sk8-guide-headers"
              body="/tmp/sk8-guide-body"
              code="$(curl -sS --max-time 20 -D "$headers" -o "$body" -w '%{http_code}' "$url" || true)"
              robots="$(tr -d '\r' < "$headers" | awk 'BEGIN{IGNORECASE=1} /^x-robots-tag:/ {sub(/^x-robots-tag:[[:space:]]*/, ""); print; exit}')"
              location="$(tr -d '\r' < "$headers" | awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^location:[[:space:]]*/, ""); print; exit}')"
              if [ "$code" = "200" ] && printf '%s' "$robots" | grep -Fqi 'noindex' && grep -Fq "$marker" "$body" && [ -z "$location" ]; then
                echo "OK direct subscriber-distributed guide: $url"
                return 0
              fi
              echo "Waiting for direct guide: $url (attempt $attempt/12; code=$code; robots=$robots; location=$location)"
              sleep 15
            done
            echo "FAILED direct guide access: $url"
            return 1
          }
          check_direct_guide '/52-adventures/guide/' '52 Adventures'
          check_direct_guide '/free-cheap-guide/guide/' 'Free &amp; Cheap'
          check_direct_guide '/halloween-half-term-guide/guide/' 'Halloween &amp; Half-Term Guide 2026'
          check_image_asset() {
            url="$1"
            label="$2"
            file_path="/tmp/sk8-critical-image"
            code="$(curl -sS -L --max-time 20 -o "$file_path" -w '%{http_code}' "$url" || true)"
            bytes="$(wc -c < "$file_path" 2>/dev/null || echo 0)"
            kind="$(file -b "$file_path" 2>/dev/null || true)"
            if [ "$code" != "200" ] || [ "$bytes" -lt 50000 ] || ! printf '%s' "$kind" | grep -Eqi 'PNG image|Web/P image|JPEG image'; then
              echo "FAILED critical image: $label (HTTP $code; bytes=$bytes; type=$kind)"
              return 1
            fi
            echo "OK critical image: $label (bytes=$bytes; type=$kind)"
          }
          check_image_asset 'https://res.cloudinary.com/gocq00bt/image/upload/f_auto,q_auto,w_900/v1790422941/sk8-scoop/52-adventures/52-adventures-guide-logo-official.png' '52 Adventures official guide logo'
          check_page '/planning/heald-green-local-plan-2026/' '1,672 homes'
          check_page '/local-history/heald-green-north-history-walk/' '22 history stops'
          check_page '/local-history/cheadle-war-memorial-air-raid-victims/' 'eight civilian names'
          check_page '/data/events.json' '"status": "verified"'
          check_page '/assets/nue-links.js' 'sk8_subscriber_recognition_v1'
          check_page '/updates/' 'Useful Updates around SK8'
          check_page '/search/' 'data-search-form'
          check_page '/assets/global-search.js' 'header_search_submit'
          check_page '/assets/global-search.css' '.global-search-panel'
          check_page '/data/discovery.json' 'secondary-school-applications-2027'
          check_page '/local-history/gatley-shouter/' 'The Gatley Shouter'
          check_page '/local-history/cheadle-station-cheshire-line-tavern/' 'The pub that used to be a station'
          check_page '/local-history/heald-green-mercury-frog/' 'Why the frog is called Mercury'
          check_page '/local-history/heald-green-lost-place-names/' 'The old place names still hiding in modern Heald Green'
          check_page '/local-history/217-finney-lane-the-brew/' 'Before The Brew served wine'
          check_page '/planning/cheadle-hulme-density-study/' 'What “up to eight storeys” actually means'
          check_page '/data/website-harvest.json' '"final_issue_checked": true'
          check_page '/planning/heald-green-east/' 'DC/095134'
          check_page '/planning/cheadle-eco-park/' 'Cheadle Eco Park'
          check_page '/kids-family/secondary-school-applications-2027/' '31 October 2026'

      - name: Verify advertiser admin preview isolation
        shell: bash
        run: |
          url="${CLOUDFLARE_PREVIEW_BASE}/api/advertiser-enquiries"
          code="$(curl -sS --max-time 20 -o /tmp/advertiser-admin.json -w '%{http_code}' "$url" -H 'authorization: Bearer intentionally-wrong-test-token')"
          if [ "$code" != "503" ] || ! grep -Fq 'admin token has not been configured' /tmp/advertiser-admin.json; then
            echo "Expected isolated Preview to withhold ADMIN_TOKEN and return 503, got $code"
            cat /tmp/advertiser-admin.json || true
            exit 1
          fi
          echo "OK Preview isolation: ADMIN_TOKEN is not inherited"

      - name: Verify Stripe webhook preview isolation
        shell: bash
        run: |
          url="${CLOUDFLARE_PREVIEW_BASE}/api/stripe-webhook"
          code="$(curl -sS --max-time 20 -o /tmp/stripe-webhook.json -w '%{http_code}' -X POST "$url" -H 'content-type: application/json' --data '{}')"
          if [ "$code" != "503" ] || ! grep -Fq 'Stripe webhook is not configured' /tmp/stripe-webhook.json; then
            echo "Expected isolated Preview to withhold STRIPE_WEBHOOK_SECRET and return 503, got $code"
            cat /tmp/stripe-webhook.json || true
            exit 1
          fi
          echo "OK Preview isolation: STRIPE_WEBHOOK_SECRET is not inherited"


  live-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare and verify changed public routes
        shell: bash
        run: |
          check_page() {
            url="$1"
            marker="$2"
            body_file="$(mktemp)"
            for attempt in $(seq 1 10); do
              if curl -fsSL --max-time 20 "$url" -o "$body_file" && grep -Fq "$marker" "$body_file"; then
                rm -f "$body_file"
                echo "OK: $url"
                return 0
              fi
              echo "Waiting for deployment: $url (attempt $attempt/10)"
              sleep 15
            done
            rm -f "$body_file"
            echo "FAILED: expected marker not found at $url"
            return 1
          }
          check_page 'https://www.sk8scoop.com/' 'homepage-utility-promise-v1'
          check_page 'https://www.sk8scoop.com/whats-on/' 'data-event-area="Cheadle"'
          check_page 'https://www.sk8scoop.com/guides/' 'data-page="guides"'
          check_page 'https://www.sk8scoop.com/guides/' 'Halloween &amp; Half-Term Family Guide 2026'
          check_page 'https://www.sk8scoop.com/start/' 'data-page="start"'
          check_page 'https://www.sk8scoop.com/join/' 'data-page="join"'
          check_page 'https://www.sk8scoop.com/submit/' 'action="/api/reader-submission"'
          check_page 'https://www.sk8scoop.com/contact/' 'data-form-kind="contact-message"'
          check_page 'https://www.sk8scoop.com/submit-event/' 'action="/api/submit-event"'
          check_page 'https://www.sk8scoop.com/business-submissions/' 'action="/api/business-submission"'
          check_page 'https://www.sk8scoop.com/advertise.html' 'value="starter_newsletter"'
          check_page 'https://www.sk8scoop.com/advertise/finder/' 'id="campaign-finder"'
          check_page 'https://www.sk8scoop.com/advertise/christmas-eating-out/' 'Promote Christmas bookings'
          check_page 'https://www.sk8scoop.com/advertise/pay/' 'Payment follows campaign approval'
          check_page 'https://www.sk8scoop.com/around-sk8/' 'data-page="around-sk8"'
          check_page 'https://www.sk8scoop.com/food-drink/' 'Food & Drink around SK8'
          check_page 'https://www.sk8scoop.com/kids-family/' 'Kids & Family around SK8'
          check_page 'https://www.sk8scoop.com/outdoors/' 'Outdoors around SK8'
          check_page 'https://www.sk8scoop.com/local-history/' 'Local History around SK8'
          check_page 'https://www.sk8scoop.com/planning/' 'Planning & Development around SK8'
          check_page 'https://www.sk8scoop.com/free-cheap-guide/' 'Heald Green North History Walk'
          check_page 'https://www.sk8scoop.com/52-adventures/' 'data-page="52-adventures"'
          check_page 'https://www.sk8scoop.com/halloween-half-term-guide/' 'Free Halloween &amp; Half-Term Family Guide 2026'
          check_page 'https://www.sk8scoop.com/halloween-half-term-guide/feedback/' 'Halloween Guide Tester Feedback'
          check_page 'https://www.sk8scoop.com/halloween/boo/' 'BOO! You found Easter egg #5'
          check_page 'https://www.sk8scoop.com/poll/issue-16/' 'What would you most like more of in next year’s Halloween coverage?'
          check_page 'https://www.sk8scoop.com/local-history/heyhead-village-disappeared/' 'Heyhead: the village that disappeared beside the airport'
          feedback_code="$(curl -sS --max-time 20 -o /tmp/halloween-feedback-api-live.json -w '%{http_code}' -X POST 'https://www.sk8scoop.com/api/reader-submission' -H 'content-type: application/json' --data '{}')"
          if [ "$feedback_code" != "400" ]; then
            echo "FAILED live Halloween feedback API readiness: expected 400 validation response, got $feedback_code"
            cat /tmp/halloween-feedback-api-live.json || true
            exit 1
          fi
          echo "OK live Halloween feedback API readiness: 400 validation response"
          check_page 'https://www.sk8scoop.com/secret-trails/cheadle/' '/secret-trails/cheadle/SK8-Secret-Trails-The-Cheadle-Case.pdf'
          pdf_headers="/tmp/secret-trail-live-headers"
          pdf_body="/tmp/secret-trail-live.pdf"
          pdf_code="$(curl -sS --max-time 30 -D "$pdf_headers" -o "$pdf_body" -w '%{http_code}' 'https://www.sk8scoop.com/secret-trails/cheadle/SK8-Secret-Trails-The-Cheadle-Case.pdf' || true)"
          pdf_bytes="$(wc -c < "$pdf_body" 2>/dev/null || echo 0)"
          pdf_kind="$(file -b "$pdf_body" 2>/dev/null || true)"
          pdf_content_type="$(tr -d '\r' < "$pdf_headers" | awk 'BEGIN{IGNORECASE=1} /^content-type:/ {print; exit}')"
          if [ "$pdf_code" != "200" ] || [ "$pdf_bytes" -lt 1000000 ] || ! printf '%s' "$pdf_kind" | grep -Fqi 'PDF document' || ! printf '%s' "$pdf_content_type" | grep -Fqi 'application/pdf'; then
            echo "FAILED Secret Trail PDF live access (HTTP $pdf_code; bytes=$pdf_bytes; type=$pdf_kind; content_type=$pdf_content_type)"
            exit 1
          fi
          echo "OK Secret Trail PDF live access (bytes=$pdf_bytes; type=$pdf_kind)"
          check_page 'https://www.sk8scoop.com/secret-trails/cheadle/feedback/' 'action="/api/secret-trail-feedback"'
          check_page 'https://www.sk8scoop.com/assets/site.js' "'secret-trail-feedback':'secret_trail_feedback_visit'"
          check_page 'https://www.sk8scoop.com/admin/secret-trail-feedback/' 'data-secret-trail-feedback-admin'
          check_direct_guide() {
            url="$1"
            marker="$2"
            for attempt in $(seq 1 10); do
              headers="/tmp/sk8-live-guide-headers"
              body="/tmp/sk8-live-guide-body"
              code="$(curl -sS --max-time 20 -D "$headers" -o "$body" -w '%{http_code}' "$url" || true)"
              robots="$(tr -d '\r' < "$headers" | awk 'BEGIN{IGNORECASE=1} /^x-robots-tag:/ {sub(/^x-robots-tag:[[:space:]]*/, ""); print; exit}')"
              location="$(tr -d '\r' < "$headers" | awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^location:[[:space:]]*/, ""); print; exit}')"
              if [ "$code" = "200" ] && printf '%s' "$robots" | grep -Fqi 'noindex' && grep -Fq "$marker" "$body" && [ -z "$location" ]; then
                echo "OK direct subscriber-distributed guide: $url"
                return 0
              fi
              echo "Waiting for direct guide: $url (attempt $attempt/10; code=$code; robots=$robots; location=$location)"
              sleep 15
            done
            echo "FAILED direct guide access: $url"
            return 1
          }
          check_direct_guide 'https://www.sk8scoop.com/52-adventures/guide/' '52 Adventures'
          check_direct_guide 'https://www.sk8scoop.com/free-cheap-guide/guide/' 'Free &amp; Cheap'
          check_direct_guide 'https://www.sk8scoop.com/halloween-half-term-guide/guide/' 'Halloween &amp; Half-Term Guide 2026'
          check_page 'https://www.sk8scoop.com/planning/heald-green-local-plan-2026/' '1,672 homes'
          check_page 'https://www.sk8scoop.com/local-history/heald-green-north-history-walk/' '22 history stops'
          check_page 'https://www.sk8scoop.com/local-history/cheadle-war-memorial-air-raid-victims/' 'eight civilian names'
          check_page 'https://www.sk8scoop.com/data/events.json' '"status": "verified"'
          check_page 'https://www.sk8scoop.com/assets/nue-links.js' 'sk8_subscriber_recognition_v1'
          check_page 'https://www.sk8scoop.com/updates/' 'Useful Updates around SK8'
          check_page 'https://www.sk8scoop.com/search/' 'data-search-form'
          check_page 'https://www.sk8scoop.com/assets/global-search.js' 'header_search_submit'
          check_page 'https://www.sk8scoop.com/assets/global-search.css' '.global-search-panel'
          check_page 'https://www.sk8scoop.com/data/discovery.json' 'secondary-school-applications-2027'
          check_page 'https://www.sk8scoop.com/local-history/gatley-shouter/' 'The Gatley Shouter'
          check_page 'https://www.sk8scoop.com/local-history/cheadle-station-cheshire-line-tavern/' 'The pub that used to be a station'
          check_page 'https://www.sk8scoop.com/local-history/heald-green-mercury-frog/' 'Why the frog is called Mercury'
          check_page 'https://www.sk8scoop.com/local-history/heald-green-lost-place-names/' 'The old place names still hiding in modern Heald Green'
          check_page 'https://www.sk8scoop.com/local-history/217-finney-lane-the-brew/' 'Before The Brew served wine'
          check_page 'https://www.sk8scoop.com/planning/cheadle-hulme-density-study/' 'What “up to eight storeys” actually means'
          check_page 'https://www.sk8scoop.com/data/website-harvest.json' '"final_issue_checked": true'
          check_page 'https://www.sk8scoop.com/planning/heald-green-east/' 'DC/095134'
          check_page 'https://www.sk8scoop.com/planning/cheadle-eco-park/' 'Cheadle Eco Park'
          check_page 'https://www.sk8scoop.com/kids-family/secondary-school-applications-2027/' '31 October 2026'

      - name: Verify production form routes and contact transport without creating records
        shell: bash
        run: |
          expect_validation() {
            url="$1"
            code="$(curl -sS --max-time 20 -o /tmp/response.json -w '%{http_code}' -X POST "$url" -H 'content-type: application/json' --data '{}')"
            if [ "$code" != "400" ]; then
              echo "Expected validation 400 from $url, got $code"
              cat /tmp/response.json || true
              exit 1
            fi
            echo "OK validation route: $url"
          }
          expect_validation 'https://www.sk8scoop.com/api/reader-submission'
          expect_validation 'https://www.sk8scoop.com/api/submit-event'
          expect_validation 'https://www.sk8scoop.com/api/advertiser-enquiry'
          expect_validation 'https://www.sk8scoop.com/api/secret-trail-feedback'

          feedback_stats_code="$(curl -sS --max-time 20 -o /tmp/secret-trail-feedback-stats.json -w '%{http_code}' 'https://www.sk8scoop.com/api/secret-trail-feedback-stats' -H 'authorization: Bearer intentionally-wrong-test-token')"
          if [ "$feedback_stats_code" != "401" ]; then
            echo "Expected Secret Trail feedback stats to reject a wrong admin token with 401, got $feedback_stats_code"
            cat /tmp/secret-trail-feedback-stats.json || true
            exit 1
          fi
          echo "OK Secret Trail feedback stats admin gate: 401"

          stripe_code="$(curl -sS --max-time 20 -o /tmp/stripe-live.json -w '%{http_code}' -X POST 'https://www.sk8scoop.com/api/stripe-webhook' -H 'content-type: application/json' --data '{}')"
          if [ "$stripe_code" != "400" ]; then
            echo "Expected unsigned live Stripe webhook to return 400, got $stripe_code"
            cat /tmp/stripe-live.json || true
            exit 1
          fi
          echo "OK live Stripe webhook secret/signature gate: 400"

          headers="$(curl -fsSL --max-time 20 -D - -o /dev/null 'https://www.sk8scoop.com/advertise/pay/' | tr -d '\r')"
          printf '%s\n' "$headers"
          require_header() {
            pattern="$1"
            label="$2"
            if ! printf '%s\n' "$headers" | grep -iq "$pattern"; then
              echo "Missing production payment-page header: $label"
              exit 1
            fi
          }
          require_header '^strict-transport-security:' 'Strict-Transport-Security'
          require_header '^x-content-type-options: nosniff' 'X-Content-Type-Options: nosniff'
          require_header '^content-security-policy:' 'Content-Security-Policy'
          require_header '^cache-control: no-store' 'Cache-Control: no-store'
          echo "OK production payment-page security headers"

          contact_code="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' 'https://submit-form.com/X3MWnWHXI')"
          case "$contact_code" in
            2*|3*|4*) echo "OK contact endpoint reachable: HTTP $contact_code" ;;
            *) echo "Formspark contact endpoint unavailable: HTTP $contact_code"; exit 1 ;;
          esac
  header-layout:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: live-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Locate Chrome
        shell: bash
        run: |
          set -eu
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v google-chrome-stable >/dev/null 2>&1; then
            echo "CHROME=$(command -v google-chrome-stable)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null 2>&1; then
            echo "CHROME=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            echo "No Chrome/Chromium available on runner"
            exit 1
          fi

      - name: Verify responsive subscriber header
        env:
          HEADER_QA_BASE_URL: https://www.sk8scoop.com
        run: node scripts/check-header-layout.mjs

      - name: Upload header screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: header-layout-qa
          path: visual-qa/header-layout/
          retention-days: 7

