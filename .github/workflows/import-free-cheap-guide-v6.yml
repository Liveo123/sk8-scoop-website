name: Add analytics directly to Free and Cheap Guide

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-free-cheap-guide-v6.yml'

permissions:
  contents: write

jobs:
  patch-guide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inject analytics script into current guide HTML
        run: |
          python - <<'PY'
          path='free-cheap-guide/guide/index.html'
          marker=b'<script src="/assets/free-cheap-guide-analytics.js" defer></script>'
          with open(path,'rb') as f:
              data=f.read()
          print('current bytes=', len(data))
          if marker in data:
              print('Analytics marker already present.')
          else:
              lower=data.lower()
              idx=lower.rfind(b'</body>')
              if idx < 0:
                  raise SystemExit('No closing body tag found')
              data=data[:idx]+marker+data[idx:]
              with open(path,'wb') as f:
                  f.write(data)
              print('patched bytes=', len(data))
          with open(path,'rb') as f:
              check=f.read()
          if marker not in check:
              raise SystemExit('Analytics marker missing after patch')
          PY
      - name: Commit tracking-enabled guide
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add free-cheap-guide/guide/index.html
          if git diff --cached --quiet; then
            echo "Guide already contains analytics script."
            exit 0
          fi
          git commit -m "Add analytics directly to Free and Cheap Guide HTML"
          git push origin HEAD:main
