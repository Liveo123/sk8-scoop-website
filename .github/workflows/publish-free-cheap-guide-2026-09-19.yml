name: Publish approved Free and Cheap Guide maintenance 2026-09-19

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-free-cheap-guide-2026-09-19.yml'

permissions:
  contents: write

jobs:
  publish-guide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply approved 19 September maintenance update exactly
        shell: bash
        run: |
          python - <<'PY2'
          from pathlib import Path
          import re, hashlib, gzip, base64, subprocess

          path = Path('free-cheap-guide/guide/index.html')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(r'data:image/[^;]+;base64,[A-Za-z0-9+/=]+')
          images = []
          def repl(m):
              i = len(images)
              images.append(m.group(0))
              return f'__SK8_IMG_{i}__'
          normal = pattern.sub(repl, text)

          if len(images) != 10:
              raise SystemExit(f'Expected 10 embedded images, found {len(images)}')

          expected_before = '75757ebf13d8947cfa6a6010097a9ae0fdb605b240dcda658e55ae89cbcf71b2'
          actual_before = hashlib.sha256(normal.encode('utf-8')).hexdigest()
          if actual_before != expected_before:
              raise SystemExit(f'Current live guide no longer matches approved 12 September base. SHA={actual_before}')

          patch_b64 = """"""
          patch = gzip.decompress(base64.b64decode(patch_b64))
          Path('/tmp/guide-normal.html').write_text(normal, encoding='utf-8')
          Path('/tmp/guide.patch').write_bytes(patch)
          subprocess.run(['patch', '/tmp/guide-normal.html', '/tmp/guide.patch'], check=True)

          updated = Path('/tmp/guide-normal.html').read_text(encoding='utf-8')
          for i, image in enumerate(images):
              token = f'__SK8_IMG_{i}__'
              if token not in updated:
                  raise SystemExit(f'Missing image placeholder {token} after patch')
              updated = updated.replace(token, image, 1)
          if '__SK8_IMG_' in updated:
              raise SystemExit('Unrestored image placeholder remains')

          marker = '<script src="/assets/free-cheap-guide-analytics.js" defer></script>'
          if updated.count(marker) != 1:
              raise SystemExit('Analytics marker missing or duplicated')

          final = updated.encode('utf-8')
          expected_size = 22696744
          expected_sha = 'f2ef3d71cac5d78a9d54200f4cd1296bc45f4dc7b44c26839255a07372ef73f5'
          if len(final) != expected_size:
              raise SystemExit(f'Unexpected final size: {len(final)}')
          actual_sha = hashlib.sha256(final).hexdigest()
          if actual_sha != expected_sha:
              raise SystemExit(f'Unexpected final SHA256: {actual_sha}')

          path.write_bytes(final)
          print('Approved maintained guide verified:', len(final), actual_sha)
          PY2

      - name: Commit approved maintained guide
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add free-cheap-guide/guide/index.html
          if git diff --cached --quiet; then
            echo "Guide already matches the approved 19 September 2026 maintenance build."
            exit 0
          fi
          git commit -m "Publish Free & Cheap Guide maintenance - 19 September 2026"
          git push origin HEAD:main
