name: Publish approved Free and Cheap Guide maintenance 2026-09-19

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-free-cheap-guide-2026-09-19.yml'

permissions:
  contents: write

jobs:
  publish-guide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply approved 19 September maintenance update exactly
        shell: bash
        run: |
          python - <<'PY2'
          from pathlib import Path
          import re, hashlib, gzip, base64, json

          path = Path('free-cheap-guide/guide/index.html')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(r'data:image/[^;]+;base64,[A-Za-z0-9+/=]+')
          images = []
          def repl(m):
              i = len(images)
              images.append(m.group(0))
              return f'__SK8_IMG_{i}__'
          normal = pattern.sub(repl, text)

          if len(images) != 10:
              raise SystemExit(f'Expected 10 embedded images, found {len(images)}')

          expected_before = '75757ebf13d8947cfa6a6010097a9ae0fdb605b240dcda658e55ae89cbcf71b2'
          actual_before = hashlib.sha256(normal.encode('utf-8')).hexdigest()
          if actual_before != expected_before:
              raise SystemExit(f'Current live guide no longer matches approved 12 September base. SHA={actual_before}')

          ops = json.loads(r'''[{"old":"H4sIAC6rrmoC/2WOPWoDMRSE+5zioSKVF8dbGEOkbQJO4XLJAWRpYj3QH9q3Nu58iJwwJ8k6wVWqYYZvhtFBUqRo88koZDXoAOsHnSCWXLBtghg1y2e3U+tHXLIgL/GFvQTjcWaH7tesOLOwjd3kbITZKMo2wagz41JLk/8bkU9BHpgrsbSlG5BwR4UlYhgPOxpdKZX2DaBnm+orvS0/K73P7EHfty/azzFe6aN6K/C06WlEFaQjGvUv/Vav/7b0JNdFnn4A0FhbPfcAAAA=","new":"H4sIAC6rrmoC/2WOPU4DMRSEe07x5CIVq/wUKAh7GyRSUK44wMMe4if5T96XRHQcghNyEhZQKqrRjL4ZjY2aEyUuR2dQzGgjOIw2Q5l85D5DnTnp27A362tci6Is8UWCRhdwFo/h19xKERVOw+w5wW0NFc5w5iy4tNr1/0aSY9Qr5muqfelGZPygKpowTs97mnytjZ46QCvO7YEel5+NDicJoK+PT3ppgRWBtvc0oSnyKzrtNrs7u/5bsbO+L3LzDetHbDvxAAAA"},{"old":"","new":"H4sIAC6rrmoC/11PO07DQBTsOcUodcLHBRLCWKKghYKC+nk9tjd57K72rRO54xpcj5Owiaho5z9tglMxe9pMix+4GzNtDjTbhVi46VorOYapezkyT5kMMLriYzCMi+oKN9MdOOCuwTtT4WfPjOa2uX/Exyzl5+vb8BbwGk/IvKSfxQ//xNftzV8RnvUkq2ExosxEHEfvvCjUhwN6jjETAku8oPu45MB1WxknZ0/K3tG2kKN4ld6rLyskDLC6dFiUBif1RfGqdbyEibU8dVe/YlPLEAoBAAA="},{"old":"H4sIAC6rrmoC/z2PwU7EMAxE7/sV8wGIskXisIp6AIK4IFDLD7iNm1TsxlViWu3fk1YrjvY8z4xfflPiqFin6GQ94fiIjmflS88JKjjW+BxUtql+qJ9MNTcHMzcma5Lom9a+tbZ7t68b2Nmvb/vxbNsdPZnqBoGXEpGhgRSBHOicmNwV4xSnHNihvxaRQaNyiiIRMu6G/00CLYyeOSLxRRZ2d6Do9qOyoOITPRwp50KdZcXKaZOGwMNPCSBfmKwYbu9K8lSyi/NMnvO96VPVHP4AXBnKBg0BAAA=","new":"H4sIAC6rrmoC/y3PwW7CMAwG4DtP4QcYK+thEijqYSwTlwnU7gXSxEqjFTtyDGVvv7biaP+frN/HmwiSwpQo8HSAegcdZsVrjwLK8LaHs1depnpXv5sqNxuTG1NUmGLT2q/Wdif7ucDOXn7s94dtV3ow1RMBPnISDOAoAKGT7br4g+AUCwzujtAjEghe+Y7hZYU6IIypaKJY5njkCSYUnJEf0P8u56JLVBT88weW6CiVuSoLeL6RTyNkF7G8ml6qZvMPFdma7e0AAAA="},{"old":"","new":"H4sIAC6rrmoC/wMAAAAAAAAAAAA="},{"old":"H4sIAC6rrmoC/wMAAAAAAAAAAAA=","new":""},{"old":"H4sIAC6rrmoC/wMAAAAAAAAAAAA=","new":""},{"old":"","new":""},{"old":"H4sIAC6rrmoC/wMAAAAAAAAAAAA=","new":""}]''')
          def dec(s):
              return gzip.decompress(base64.b64decode(s)).decode('utf-8')

          updated = normal
          for i, op in enumerate(ops):
              old = dec(op['old'])
              new = dec(op['new'])
              if old:
                  count = updated.count(old)
                  if count != 1:
                      raise SystemExit(f'Replacement {i}: expected old block exactly once, found {count}')
                  updated = updated.replace(old, new, 1)
              else:
                  # Insertions are represented by replacing an empty block after the previous
                  # exact operation; use a stable marker from the next segment.
                  if i == 4:
                      marker = '<article class="guide-entry event-card"><h4 class="entry-title event-entry-title"><span class="event-date-kicker">SATURDAY 26 SEPTEMBER</span><span class="event-title-text">ARC SATURDAY ART CLUB</span></h4>'
                      pos = updated.find(marker)
                      if pos < 0: raise SystemExit('Insertion marker 4 missing')
                      updated = updated[:pos] + new + updated[pos:]
                  elif i == 5:
                      marker = '<article class="guide-entry event-card"><h4 class="entry-title event-entry-title"><span class="event-date-kicker">SATURDAY 3 OCTOBER</span><span class="event-title-text">STOCKROOM SOUNDSYSTEM: FITTINGS, DRIVERS &amp; AMPLIFIERS</span></h4>'
                      pos = updated.find(marker)
                      if pos < 0: raise SystemExit('Insertion marker 5 missing')
                      updated = updated[:pos] + new + updated[pos:]
                  elif i == 7:
                      marker = '</section><footer class="experience-footer">'
                      pos = updated.find(marker)
                      if pos < 0: raise SystemExit('Insertion marker 7 missing')
                      updated = updated[:pos] + new + updated[pos:]
                  else:
                      raise SystemExit(f'Unexpected insertion op {i}')

          for i, image in enumerate(images):
              token = f'__SK8_IMG_{i}__'
              if token not in updated:
                  raise SystemExit(f'Missing image placeholder {token}')
              updated = updated.replace(token, image, 1)
          if '__SK8_IMG_' in updated:
              raise SystemExit('Unrestored image placeholder remains')

          marker = '<script src="/assets/free-cheap-guide-analytics.js" defer></script>'
          if updated.count(marker) != 1:
              raise SystemExit('Analytics marker missing or duplicated')

          final = updated.encode('utf-8')
          expected_size = 22696744
          expected_sha = 'f2ef3d71cac5d78a9d54200f4cd1296bc45f4dc7b44c26839255a07372ef73f5'
          if len(final) != expected_size:
              raise SystemExit(f'Unexpected final size: {len(final)}')
          actual_sha = hashlib.sha256(final).hexdigest()
          if actual_sha != expected_sha:
              raise SystemExit(f'Unexpected final SHA256: {actual_sha}')

          path.write_bytes(final)
          print('Approved maintained guide verified:', len(final), actual_sha)
          PY2

      - name: Commit approved maintained guide
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add free-cheap-guide/guide/index.html
          if git diff --cached --quiet; then
            echo "Guide already matches the approved 19 September 2026 maintenance build."
            exit 0
          fi
          git commit -m "Publish Free & Cheap Guide maintenance - 19 September 2026"
          git push origin HEAD:main
