name: Halloween Guide Link QA

permissions:
  contents: read
  checks: read
  issues: read
  pull-requests: read

on:
  pull_request:
    paths:
      - 'worker-protected.js'
      - 'worker-business-v2.js'
      - 'wrangler.toml'
      - 'halloween-half-term-guide/guide/index.html'
      - 'tests/halloween-guide-links-browser.mjs'
      - 'scripts/check-guide-public-samples.mjs'
      - '.github/workflows/halloween-guide-links-qa.yml'
      - '.github/workflows/post-launch-site-qa.yml'
  push:
    branches:
      - main
    paths:
      - 'worker-protected.js'
      - 'worker-business-v2.js'
      - 'wrangler.toml'
      - 'halloween-half-term-guide/guide/index.html'
      - 'tests/halloween-guide-links-browser.mjs'
      - 'scripts/check-guide-public-samples.mjs'
      - '.github/workflows/halloween-guide-links-qa.yml'
      - '.github/workflows/post-launch-site-qa.yml'

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Static direct-route and filter contracts
        run: |
          node --check worker-protected.js
          node --check tests/halloween-guide-links-browser.mjs
          node scripts/check-guide-public-samples.mjs

      - name: Locate Chrome
        shell: bash
        run: |
          set -eu
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v google-chrome-stable >/dev/null 2>&1; then
            echo "CHROME=$(command -v google-chrome-stable)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null 2>&1; then
            echo "CHROME=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            echo "No Chrome/Chromium available"
            exit 1
          fi

      - name: Resolve exact Cloudflare preview URL
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          auth=(-H "authorization: Bearer ${GH_TOKEN}" -H "accept: application/vnd.github+json")
          short_sha="$(printf '%s' "$PREVIEW_SHA" | cut -c1-7)"
          base=""
          for attempt in $(seq 1 30); do
            comments_api="https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments"
            comments="$(curl -fsSL --max-time 20 "${auth[@]}" "$comments_api" || true)"
            body="$(printf '%s' "$comments" | jq -r '[.[]? | select(.user.login=="cloudflare-workers-and-pages[bot]")][-1].body // empty' 2>/dev/null || true)"
            line="$(printf '%s\n' "$body" | grep -F '### Preview URL:' | head -n 1 || true)"
            url="$(printf '%s\n' "$line" | grep -Eo 'https://[^ )]+' | head -n 1 || true)"
            sha="$(printf '%s\n' "$line" | grep -Eo 'commit [0-9a-f]{7,40}' | awk '{print $2}' | head -n 1 || true)"
            immutable="$(printf '%s\n' "$body" | grep -Eo 'https://[0-9a-f]{8}\.previews\.sk8scoop\.com' | head -n 1 || true)"
            if [ -n "$url" ] && [ "$sha" = "$short_sha" ]; then
              base="${immutable:-$url}"
              break
            fi
            echo "Waiting for exact Cloudflare preview (attempt $attempt/30; found $url at $sha; expected $short_sha)"
            sleep 10
          done
          if [ -z "$base" ]; then
            echo "No exact preview URL found"
            exit 1
          fi
          echo "GUIDE_QA_BASE_URL=$base" >> "$GITHUB_ENV"
          echo "Using $base"

      - name: Use production URL after main deployment
        if: github.event_name == 'push'
        run: echo "GUIDE_QA_BASE_URL=https://www.sk8scoop.com" >> "$GITHUB_ENV"

      - name: Wait for guide route
        shell: bash
        run: |
          set -eu
          for attempt in $(seq 1 12); do
            code="$(curl -sS --max-time 20 -o /tmp/halloween-guide.html -w '%{http_code}' "$GUIDE_QA_BASE_URL/halloween-half-term-guide/guide/" || true)"
            if [ "$code" = "200" ] && grep -Fq 'id="filters"' /tmp/halloween-guide.html; then
              echo "Direct guide is ready."
              exit 0
            fi
            echo "Waiting for guide route (attempt $attempt/12; HTTP $code)"
            sleep 15
          done
          echo "Direct guide did not become ready."
          exit 1

      - name: Run direct-link, filter, anchor and mobile browser QA
        env:
          GUIDE_QA_BASE_URL: ${{ env.GUIDE_QA_BASE_URL }}
          CHROME: ${{ env.CHROME }}
        run: node tests/halloween-guide-links-browser.mjs
