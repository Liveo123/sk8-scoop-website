name: Responsive header QA (PR)
on:
  pull_request:
    paths:
      - 'assets/styles.css'
      - 'assets/global-search.css'
      - 'assets/global-search.js'
      - 'assets/site.js'
      - 'assets/config.js'
      - 'scripts/check-header-layout.mjs'
      - 'tests/post-rebuild-growth-smoke.mjs'
      - '.github/workflows/responsive-header-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  responsive-header:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source and responsive contracts
        run: node --test tests/post-rebuild-growth-smoke.mjs
      - name: Start local static preview
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/sk8-growth-header-server.log 2>&1 &
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8765/advertise.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/sk8-growth-header-server.log
          exit 1
      - name: Check actual browser header at breakpoint widths
        env:
          CHROME: google-chrome
          HEADER_QA_BASE_URL: http://127.0.0.1:8765
        run: node scripts/check-header-layout.mjs
      - name: Upload layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: growth-header-${{ github.run_id }}
          path: visual-qa/header-layout/
          if-no-files-found: ignore
