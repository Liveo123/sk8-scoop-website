name: My SK8 Preview QA

permissions:
  contents: read
  checks: read
  issues: read
  pull-requests: read

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'assets/my-sk8.js'
      - 'assets/my-sk8.css'
      - 'assets/whats-on.js'
      - 'assets/site.js'
      - 'whats-on/index.html'
      - 'my-sk8/index.html'
      - 'privacy.html'
      - 'local-history/gatley-shouter/index.html'
      - 'planning/heald-green-east/index.html'
      - 'kids-family/secondary-school-applications-2027/index.html'
      - 'outdoors/marple-locks-aqueduct/index.html'
      - 'outdoors/gatley-carrs/index.html'
      - 'outdoors/east-avenue-park-heald-green/index.html'
      - 'kids-family/bruntwood-park/index.html'
      - 'kids-family/abney-hall-park/index.html'
      - 'planning/cheadle-eco-park/index.html'
      - 'local-history/heald-green-north-history-walk/index.html'
      - 'tests/my-sk8-browser.mjs'
      - '.github/workflows/my-sk8-preview-qa.yml'

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate Chrome
        shell: bash
        run: |
          set -eu
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v google-chrome-stable >/dev/null 2>&1; then
            echo "CHROME=$(command -v google-chrome-stable)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null 2>&1; then
            echo "CHROME=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            echo "No Chrome/Chromium available"
            exit 1
          fi

      - name: Resolve exact Cloudflare preview URL
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          auth=(-H "authorization: Bearer ${GH_TOKEN}" -H "accept: application/vnd.github+json")
          short_sha="$(printf '%s' "$PREVIEW_SHA" | cut -c1-7)"
          base=""
          for attempt in $(seq 1 30); do
            comments_api="https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments"
            comments="$(curl -fsSL --max-time 20 "${auth[@]}" "$comments_api" || true)"
            body="$(printf '%s' "$comments" | jq -r '[.[]? | select(.user.login=="cloudflare-workers-and-pages[bot]")][-1].body // empty' 2>/dev/null || true)"
            line="$(printf '%s\n' "$body" | grep -F '### Preview URL:' | head -n 1 || true)"
            url="$(printf '%s\n' "$line" | grep -Eo 'https://[^ )]+' | head -n 1 || true)"
            sha="$(printf '%s\n' "$line" | grep -Eo 'commit [0-9a-f]{7,40}' | awk '{print $2}' | head -n 1 || true)"
            immutable="$(printf '%s\n' "$body" | grep -Eo 'https://[0-9a-f]{8}\.previews\.sk8scoop\.com' | head -n 1 || true)"
            if [ -n "$url" ] && [ "$sha" = "$short_sha" ]; then
              base="${immutable:-$url}"
              break
            fi
            echo "Waiting for exact Cloudflare preview (attempt $attempt/30; found $url at $sha; expected $short_sha)"
            sleep 10
          done
          if [ -z "$base" ]; then
            echo "No exact preview URL found"
            exit 1
          fi
          echo "PREVIEW_URL=$base" >> "$GITHUB_ENV"
          echo "Using $base"

      - name: Wait for My SK8 preview files
        shell: bash
        run: |
          set -eu
          for attempt in $(seq 1 10); do
            page_code="$(curl -sS -L --max-time 20 -o /tmp/my-sk8.html -w '%{http_code}' "$PREVIEW_URL/my-sk8/" || true)"
            js_code="$(curl -sS -L --max-time 20 -o /tmp/my-sk8.js -w '%{http_code}' "$PREVIEW_URL/assets/my-sk8.js" || true)"
            if [ "$page_code" = "200" ] && [ "$js_code" = "200" ] &&
               grep -Fq 'data-page="my-sk8"' /tmp/my-sk8.html &&
               grep -Fq 'sk8_saved_items_v1' /tmp/my-sk8.js; then
              echo "My SK8 preview is current."
              exit 0
            fi
            echo "Waiting for My SK8 preview (attempt $attempt/10; page=$page_code; js=$js_code)"
            head -c 180 /tmp/my-sk8.html 2>/dev/null || true
            echo
            sleep 8
          done
          echo "My SK8 preview files did not become available."
          exit 1

      - name: Run real browser functional and mobile QA
        env:
          PREVIEW_URL: ${{ env.PREVIEW_URL }}
          CHROME: ${{ env.CHROME }}
        run: node tests/my-sk8-browser.mjs

      - name: Capture Issue 16 MailerLite render evidence
        if: always()
        shell: bash
        env:
          I16_SCREENSHOT: "https://storage.googleapis.com/mailerlite-screenshots-prod/screenshot/emails/200591761988387933/1284x7362026-10-07-06:57:01.png"
          I14_SCREENSHOT: "https://storage.googleapis.com/mailerlite-screenshots-prod/screenshot/emails/199597988175152448/1284x7362026-09-25-17:01:22.png"
          I16_PREVIEW: "https://connect.mailerlite.com/emails/200591761988387933/preview"
          I14_PREVIEW: "https://preview.mailerlite.io/preview/2462354/emails/199597988175152448"
        run: |
          set -eu
          mkdir -p visual-qa/mailerlite
          curl -fsSL --max-time 30 "$I16_SCREENSHOT" -o visual-qa/mailerlite/issue16-desktop.png
          curl -fsSL --max-time 30 "$I14_SCREENSHOT" -o visual-qa/mailerlite/issue14-desktop.png

          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars             --force-device-scale-factor=1 --window-size=390,844 --virtual-time-budget=7000             --user-agent="Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1"             --screenshot=visual-qa/mailerlite/issue16-mobile.png "$I16_PREVIEW"

          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars             --force-device-scale-factor=1 --window-size=390,844 --virtual-time-budget=7000             --user-agent="Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1"             --screenshot=visual-qa/mailerlite/issue14-mobile.png "$I14_PREVIEW"

          for name in issue16-desktop issue14-desktop issue16-mobile issue14-mobile; do
            test -s "visual-qa/mailerlite/$name.png"
            echo "MAILERLITE_IMAGE_BEGIN:$name"
            base64 -w0 "visual-qa/mailerlite/$name.png"
            echo
            echo "MAILERLITE_IMAGE_END:$name"
          done

      - name: Upload MailerLite render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue16-mailerlite-render-qa
          path: visual-qa/mailerlite/
          retention-days: 14

      - name: Upload screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: my-sk8-preview-qa
          path: visual-qa/my-sk8/
          retention-days: 14
