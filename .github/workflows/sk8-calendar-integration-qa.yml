name: SK8 Calendar Integration QA

on:
  pull_request:
    paths:
      - 'assets/whats-on.js'
      - 'assets/whats-on-calendar.js'
      - 'assets/whats-on-calendar.css'
      - 'assets/sk8-calendar-core.js'
      - 'assets/my-sk8.js'
      - 'whats-on/index.html'
      - 'data/events.json'
      - 'tests/whats-on-calendar-browser.mjs'
      - 'tests/whats-on-weekend.cjs'
      - '.github/workflows/sk8-calendar-integration-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate calendar JavaScript and event records
        run: |
          node --check assets/sk8-calendar-core.js
          node --check assets/whats-on-calendar.js
          node --check assets/whats-on.js
          node --check assets/my-sk8.js
          node --check tests/whats-on-calendar-browser.mjs
          node tests/sk8-calendar-core.mjs
          node tests/whats-on-weekend.cjs
          node scripts/check-events-data.mjs

      - name: Find Chrome
        shell: bash
        run: |
          set -eu
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v google-chrome-stable >/dev/null 2>&1; then
            echo "CHROME=$(command -v google-chrome-stable)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null 2>&1; then
            echo "CHROME=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            echo "Chrome is unavailable"
            exit 1
          fi

      - name: Serve exact pull request files
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/sk8-calendar-http.log 2>&1 &
          for i in $(seq 1 25); do
            if curl -fsS --max-time 3 http://127.0.0.1:8765/data/events.json -o /tmp/sk8-calendar-events.json; then
              break
            fi
            sleep 1
          done
          test -s /tmp/sk8-calendar-events.json

      - name: Run desktop/mobile browser tests with real My SK8
        env:
          PREVIEW_URL: http://127.0.0.1:8765
        run: node tests/whats-on-calendar-browser.mjs

      - name: Save browser review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whats-on-calendar-desktop-mobile
          path: visual-qa/calendar
          if-no-files-found: ignore
