name: Publish approved Free and Cheap Guide - 12 September 2026

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-free-cheap-guide-v5.yml'

permissions:
  contents: write

jobs:
  import-guide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download approved Drive HTML
        run: |
          python - <<'PY'
          import requests
          file_id='1YDvo0tsdjEbNhYnLnVxfgDzTJONe0PQ8'
          urls=[
              f'https://drive.usercontent.google.com/download?id={file_id}&export=download&confirm=t',
              f'https://drive.google.com/uc?export=download&confirm=t&id={file_id}',
          ]
          for url in urls:
              r=requests.get(url,timeout=180,allow_redirects=True)
              print('attempt',url,'status',r.status_code,'bytes',len(r.content),'type',r.headers.get('content-type'))
              if len(r.content) > 10_000_000 and b'<html' not in r.content[:1000].lower():
                  open('/tmp/guide.html','wb').write(r.content)
                  break
          else:
              raise SystemExit('Could not download approved guide bytes directly from Drive')
          PY
      - name: Verify exact approved source
        run: |
          wc -c /tmp/guide.html
          sha256sum /tmp/guide.html
          test "$(wc -c < /tmp/guide.html)" = "22693871"
          echo "49e8090921b2d637c9cdbfb501008f821122bc5e87ab87b8127491c991f122e0  /tmp/guide.html" | sha256sum -c -
      - name: Replace web guide without modifying it
        run: |
          cp /tmp/guide.html free-cheap-guide/guide/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add free-cheap-guide/guide/index.html
          if git diff --cached --quiet; then
            echo "Guide already matches approved source."
            exit 0
          fi
          git commit -m "Publish refreshed Free & Cheap Guide - 12 September 2026"
          git push origin HEAD:main
