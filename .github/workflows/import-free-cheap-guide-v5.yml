name: Publish approved Free and Cheap Guide - 12 September 2026

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-free-cheap-guide-v5.yml'

permissions:
  contents: write

jobs:
  publish-guide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild approved guide from payload
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, base64, bz2, hashlib

          guide = Path('free-cheap-guide/guide/index.html')
          current = guide.read_text(encoding='utf-8')

          image_pattern = r'data:image/(?:webp|png|jpeg|jpg);base64,[A-Za-z0-9+/=]+'
          images = re.findall(image_pattern, current)
          if len(images) != 10:
              raise SystemExit(f'Expected 10 embedded images, found {len(images)}')

          payload_dir = Path('free-cheap-guide/publish-payload')
          encoded = ''.join(
              (payload_dir / f'chunk{i}.b64').read_text().strip()
              for i in range(1, 6)
          )

          skeleton = bz2.decompress(base64.b64decode(encoded)).decode('utf-8')
          rebuilt = skeleton
          for i, img in enumerate(images):
              token = f'__SK8_IMAGE_{i}__'
              if token not in rebuilt:
                  raise SystemExit(f'Missing image token {token}')
              rebuilt = rebuilt.replace(token, img, 1)

          if re.search(r'__SK8_IMAGE_\d+__', rebuilt):
              raise SystemExit('Unreplaced image token remains')

          guide.write_text(rebuilt, encoding='utf-8')
          data = guide.read_bytes()
          digest = hashlib.sha256(data).hexdigest()
          print('bytes=', len(data))
          print('sha256=', digest)

          if len(data) != 22693871:
              raise SystemExit('Unexpected output size')
          if digest != '49e8090921b2d637c9cdbfb501008f821122bc5e87ab87b8127491c991f122e0':
              raise SystemExit('Unexpected output hash')
          PY

      - name: Commit approved guide
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add free-cheap-guide/guide/index.html
          if git diff --cached --quiet; then
            echo "Guide already matches approved publish-ready version."
            exit 0
          fi
          git commit -m "Publish refreshed Free & Cheap Guide - 12 September 2026"
          git push origin HEAD:main
