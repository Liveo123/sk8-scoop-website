<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Confirm your reader survey | SK8 Scoop</title><link rel="stylesheet" href="/assets/engagement-forms.css"></head><body><main class="sk8-shell"><a href="/"><img class="brand" src="/assets/sk8-scoop-logo.webp" alt="SK8 Scoop"></a><section class="sheet"><div class="eyebrow">Optional subscriber survey</div><h1>Confirm your email address</h1><p>Only confirm if you requested to link your voluntary survey answers to an existing SK8 Scoop subscriber profile. This will not start a new subscription.</p><button type="button" id="confirm" class="btn full">CONFIRM MY SURVEY</button><p id="status" aria-live="polite"></p><p class="privacy"><a href="/privacy">Privacy notice</a> · <a href="mailto:contact@sk8scoop.com">contact@sk8scoop.com</a></p></section></main><script>(function(){const p=new URLSearchParams(location.search);const token=p.get('token');history.replaceState({},'',location.pathname);const button=document.getElementById('confirm'),status=document.getElementById('status');if(!token||!/^[a-f0-9]{64}$/.test(token)){button.disabled=true;status.textContent='The link is invalid or has expired.';return;}button.addEventListener('click',async()=>{button.disabled=true;status.textContent='Checking your request…';try{const r=await fetch('/api/reader-demographics/confirm',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token,started_at:Date.now()-3000,privacy_acknowledged:true})});const j=await r.json();if(!r.ok)throw new Error(j.error||'Could not confirm');status.textContent=j.message;if(j.can_retry){button.textContent='RETRY PROFILE UPDATE';button.disabled=false;}else{button.hidden=true;}}catch(e){status.textContent=e.message;button.disabled=false;}})})();</script></body></html>
