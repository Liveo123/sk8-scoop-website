<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" role="img" aria-labelledby="title desc">
<title id="title">Illustrated collage of local SK8 life</title><desc id="desc">A friendly paper collage showing local streets, parks, a bridge, cafés and area notes for Cheadle, Cheadle Hulme, Gatley and Heald Green.</desc>
<defs>
