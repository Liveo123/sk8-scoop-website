  <pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fffaf0"/><circle cx="4" cy="7" r=".8" fill="#d6cdbf" opacity=".28"/><circle cx="19" cy="15" r=".7" fill="#d6cdbf" opacity=".2"/></pattern>
</defs>
<rect x="18" y="20" width="864" height="610" rx="40" fill="url(#paper)" stroke="#d9dfda" stroke-width="2"/>
