<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" role="img" aria-labelledby="t d"><title id="t">Illustrated community noticeboard</title><desc id="d">A noticeboard with cards for events, openings, offers, jobs and useful community information.</desc>
