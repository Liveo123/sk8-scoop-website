<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>BOO! You found Easter egg #5 | SK8 Scoop</title>
  <meta name="description" content="A tiny Halloween reward for sharp-eyed SK8 Scoop readers.">
  <meta name="theme-color" content="#111415">
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/assets/styles.css">
  <style>
    :root{--ink:#f7f1e7;--wall:#171a1b;--wall2:#222728;--teal:#0f6470;--orange:#e85b1b;--muted:#c9cfca;--switch:#cfc5ae;--switch-dark:#716a5c}
    *{box-sizing:border-box}
    html{background:#0b0d0e}
    body{margin:0;min-height:100vh;background:
      radial-gradient(circle at 50% 22%,rgba(255,196,96,.07),transparent 28rem),
      linear-gradient(180deg,var(--wall2),var(--wall));color:var(--ink);
      font:18px/1.55 "Open Sans",Arial,sans-serif}
    .skip-link{position:absolute;left:12px;top:12px;transform:translateY(-180%);background:#fff;color:#111;padding:10px 14px;border-radius:6px;z-index:5}
    .skip-link:focus{transform:none}
    .wrap{width:min(100% - 32px,720px);margin:auto}
    header{padding:22px 0 0}
    .brand{display:inline-block}
    .brand img{width:min(260px,68vw);height:auto;}
    main{min-height:calc(100vh - 100px);display:grid;place-items:center;padding:28px 0 48px}
    .scene{text-align:center;width:100%}
    .eyebrow{margin:0 0 12px;font-size:.78rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:#ffc06a}
    h1{font-size:clamp(3.4rem,12vw,6.5rem);line-height:.9;margin:0 0 14px;letter-spacing:-.05em}
    .lede{max-width:38rem;margin:0 auto 26px;color:var(--muted)}
    .switch-link{display:inline-block;text-decoration:none;color:#111;margin:8px auto 24px}
    .switch{width:74px;height:104px;border-radius:12px;background:linear-gradient(145deg,#e2d9c8,#aaa08e);border:2px solid #6f685b;box-shadow:0 12px 30px #0009,inset 0 1px 0 #fff9;padding:22px 18px}
    .switch-toggle{display:block;width:34px;height:58px;margin:auto;border-radius:4px;background:linear-gradient(#e9e0d0 0 44%,#857c6c 45% 100%);border:1px solid #615a4e;box-shadow:inset 0 2px 3px #fff8}
    .switch-label{display:block;margin-top:8px;font-size:.74rem;color:#d8d4ca}
    .reveal{max-width:560px;margin:8px auto 0;background:rgba(0,0,0,.34);border:1px solid #ffffff22;border-radius:18px;padding:26px 24px;box-shadow:0 18px 50px #0005;opacity:0;visibility:hidden;transform:translateY(14px) scale(.985);transition:opacity .35s ease,transform .35s ease,visibility 0s linear .35s}
    body.revealed .reveal{opacity:1;visibility:visible;transform:none;transition-delay:0s}
    body.activating .switch-art{animation:switchPress .9s cubic-bezier(.2,.8,.2,1) 1}
    body.revealed .switch-art{filter:drop-shadow(0 18px 28px #0008) drop-shadow(0 0 26px rgba(255,149,30,.55))}
    body.revealed .switch-hint{opacity:.55}
    .reveal p{margin:.3rem 0 1.15rem}.boo-art{display:block;width:100%;height:auto;border-radius:14px;margin:16px auto 20px;border:1px solid #ffffff24;box-shadow:0 14px 36px #0008}
    .button{display:inline-block;min-height:48px;padding:12px 18px;border-radius:7px;background:var(--teal);color:#fff!important;font-weight:800;text-decoration:none}
    .button:hover,.button:focus-visible{background:#0a5059}
    a:focus-visible{outline:4px solid #ffc06a;outline-offset:4px}
    .back{display:inline-block;margin-top:18px;color:#f3eee4;text-underline-offset:3px}
    .shadow{position:fixed;inset:0;pointer-events:none;background:#000;opacity:0}
    body.activating .shadow{animation:flicker 1.05s ease-out 1}
    @keyframes flicker{0%,100%{opacity:0}12%{opacity:.72}21%{opacity:.08}33%{opacity:.55}44%{opacity:.12}58%{opacity:.42}72%{opacity:.04}}
    @keyframes switchPress{0%{transform:scale(1)}18%{transform:scale(.94) rotate(-1deg)}32%{transform:scale(.97) rotate(1deg)}48%{transform:scale(.955)}68%{transform:scale(1.02)}100%{transform:scale(1)}}
    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{scroll-behavior:auto!important;animation:none!important;transition:none!important}
    }
    @media(max-width:420px){
      body{font-size:17px}
      header{padding-top:18px}
      .reveal{padding:22px 18px}
    }
  </style>
</head>
<body data-page="halloween-boo">
  <a class="skip-link" href="#main">Skip to the surprise</a>
  <div class="shadow" aria-hidden="true"></div>
  <main id="main" class="wrap">
    <section class="scene" aria-labelledby="boo-title">
      <p class="eyebrow">Issue 16 · Halloween</p>
      <p class="switch-hint" aria-hidden="true">You pressed the switch. Something moved in the dark...</p>
      <div class="reveal" id="reveal">
        <h1 id="boo-title">BOO!</h1>
        <p><strong>You found Easter egg #5.</strong></p>
        <img class="boo-art" src="https://res.cloudinary.com/gocq00bt/image/upload/c_limit,w_1100,q_auto:good,f_jpg/v1791444955/sk8scoop/issue16/boo-scary-reveal-v2.png" alt="Horror illustration: a shadowy ghost reaches towards the viewer in a dark passage beneath a bare light bulb.">
        <p>Found all five? Tell us what you spotted and we’ll see who cracked the full set.</p>
        <a class="button" href="/contact/?utm_source=halloween_boo&amp;utm_medium=owned&amp;utm_campaign=issue16_halloween&amp;utm_content=found_all_five">I found all five</a>
        <br>
        <a class="back" href="/">Back to SK8 Scoop</a>
      </div>
    </section>
  </main>
  <script src="/assets/config.js"></script>
  <script src="/assets/site.js"></script>
  <script>
    (() => {
      const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let tracked = false;
      function trackReveal(){
        if (!tracked && typeof window.gtag === 'function') {
          window.gtag('event','halloween_easter_egg_reveal',{issue:16,egg:5,source:'newsletter'});
          tracked = true;
        }
      }
      function reveal(){
        if (document.body.classList.contains('revealed')) return;
        trackReveal();
        if (reduceMotion) {
          document.body.classList.add('revealed');
          return;
        }
        document.body.classList.add('activating');
        window.setTimeout(() => {
          document.body.classList.remove('activating');
          document.body.classList.add('revealed');
        }, 520);
      }
      window.setTimeout(reveal, 120);
    })();
  </script>
</body>
</html>
