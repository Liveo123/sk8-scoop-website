name = "sk8-scoop"
main = "worker-business-v2.js"
compatibility_date = "2026-07-24"
keep_vars = true

[secrets]
required = [ "ADMIN_TOKEN", "MAILERLITE_API_TOKEN", "TURNSTILE_SECRET_KEY", "RESEND_API_KEY", "STRIPE_WEBHOOK_SECRET" ]

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = [ "/api/*", "/free-cheap-guide/guide*", "/52-adventures/guide*", "/advertise/pay/*", "/admin/*" ]
html_handling = "auto-trailing-slash"

# Cloudflare will provision and bind a D1 database for this Worker.
[[d1_databases]]
binding = "DB"
